apiVersion: relay/v1
kind: Config
name: example
cluster: prod          # existing Cluster; file never creates one

instance:
  create: true
database: {}
tables:
  - name: orders
    # schema: public   # default
    columns:
      - name: id
        type: serial
        primary_key: true
      - name: amount
        type: numeric
        nullable: false
kafka:
  partitions: 3
  replicas: 3
  min.insync.replicas: 2
